name: iOS Build (AutoReel)

on:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'AutoReel/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'AutoReel/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar AutoReel
    runs-on: macos-15
    timeout-minutes: 90

    defaults:
      run:
        working-directory: AutoReel

    env:
      DERIVED_DATA: DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Mostrar entorno Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Instalar herramientas
        run: brew install xcodegen xcbeautify

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ hashFiles('AutoReel/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Resolver dependencias SPM
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AutoReel.xcodeproj \
            -scheme AutoReel \
            -derivedDataPath "$DERIVED_DATA"

      - name: Compilar para iOS (dispositivo, sin firma)
        run: |
          set -o pipefail
          xcodebuild build \
            -project AutoReel.xcodeproj \
            -scheme AutoReel \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee xcodebuild-device.log | xcbeautify --renderer github-actions

      - name: Compilar para simulador iOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project AutoReel.xcodeproj \
            -scheme AutoReel \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-sim.log | xcbeautify --renderer github-actions

      - name: Preparar artefacto (.app simulador)
        run: |
          APP_PATH=$(find "$DERIVED_DATA/Build/Products" -name 'AutoReel.app' -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No se encontró AutoReel.app"
            find "$DERIVED_DATA" -name '*.app' || true
            exit 1
          fi
          mkdir -p build-artifact
          cp -R "$APP_PATH" build-artifact/
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Publicar AutoReel.app
        uses: actions/upload-artifact@v4
        with:
          name: AutoReel-simulator-app
          path: AutoReel/build-artifact/AutoReel.app
          retention-days: 7

      - name: Subir logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            AutoReel/xcodebuild-device.log
            AutoReel/xcodebuild-sim.log
          if-no-files-found: ignore

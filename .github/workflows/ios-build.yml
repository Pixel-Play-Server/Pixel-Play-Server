name: iOS Build (AutoReel)

on:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'AutoReel/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'AutoReel/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Compilar AutoReel
    runs-on: macos-15
    timeout-minutes: 90

    defaults:
      run:
        working-directory: AutoReel

    env:
      DERIVED_DATA: DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Mostrar entorno Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Instalar herramientas
        run: brew install xcodegen xcbeautify

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ hashFiles('AutoReel/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Leer versión de la app
        id: app_version
        run: |
          PLIST=AutoReel/Resources/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "App v$VERSION (build $BUILD)"

      - name: Resolver dependencias SPM
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AutoReel.xcodeproj \
            -scheme AutoReel \
            -derivedDataPath "$DERIVED_DATA"

      - name: Compilar para iPhone (arm64, ad-hoc para SideStore)
        run: |
          set -o pipefail
          xcodebuild build \
            -project AutoReel.xcodeproj \
            -scheme AutoReel \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | tee xcodebuild-device.log | xcbeautify --renderer github-actions

      - name: Embeber frameworks FFmpeg (fix crash al iniciar)
        run: |
          APP_PATH=$(find "$DERIVED_DATA/Build/Products" -path '*Release-iphoneos/AutoReel.app' -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No se encontró AutoReel.app"
            exit 1
          fi
          chmod +x scripts/embed-frameworks.sh
          ./scripts/embed-frameworks.sh "$APP_PATH" "$DERIVED_DATA"

      - name: Empaquetar IPA sin firmar (SideStore)
        run: |
          APP_PATH=$(find "$DERIVED_DATA/Build/Products" -path '*Release-iphoneos/AutoReel.app' -type d | head -n 1)
          mkdir -p build-artifact/Payload
          cp -R "$APP_PATH" build-artifact/Payload/
          cd build-artifact
          IPA_NAME="AutoReel-v${{ steps.app_version.outputs.version }}-b${{ steps.app_version.outputs.build }}.ipa"
          zip -r "$IPA_NAME" Payload
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_ENV"
          echo "IPA listo: $IPA_NAME"

      - name: Publicar artefacto Actions (backup)
        uses: actions/upload-artifact@v4
        with:
          name: AutoReel-unsigned-ipa
          path: AutoReel/build-artifact/${{ env.ipa_name }}
          retention-days: 14

      - name: Publicar GitHub Release (descarga en iPhone)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v${{ steps.app_version.outputs.version }}-b${{ steps.app_version.outputs.build }}-r${{ github.run_number }}
          name: AutoReel iOS v${{ steps.app_version.outputs.version }} (build ${{ steps.app_version.outputs.build }})
          body: |
            ## AutoReel para iPhone (SideStore)

            IPA sin firmar listo para instalar con [SideStore](https://sidestore.io/). SideStore firma la app con tu Apple ID al instalarla.

            | | |
            |---|---|
            | **Versión** | ${{ steps.app_version.outputs.version }} |
            | **Build** | ${{ steps.app_version.outputs.build }} |
            | **Commit** | `${{ github.sha }}` |

            ### Instalar en iPhone
            1. Descarga **`${{ env.ipa_name }}`** abajo
            2. Abre con **Archivos** → Compartir → **SideStore**

            > El release más reciente (Latest) siempre es el build actual.
          prerelease: true
          make_latest: true
          files: AutoReel/build-artifact/${{ env.ipa_name }}

      - name: Subir logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: AutoReel/xcodebuild-device.log
          if-no-files-found: ignore

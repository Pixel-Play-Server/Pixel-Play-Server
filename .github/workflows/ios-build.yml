name: iOS Build (AutoReel)

on:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'AutoReel/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'AutoReel/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar AutoReel
    runs-on: macos-15
    timeout-minutes: 90

    defaults:
      run:
        working-directory: AutoReel

    env:
      DERIVED_DATA: DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Mostrar entorno Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Instalar herramientas
        run: brew install xcodegen xcbeautify

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ hashFiles('AutoReel/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Resolver dependencias SPM
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AutoReel.xcodeproj \
            -scheme AutoReel \
            -derivedDataPath "$DERIVED_DATA"

      - name: Compilar para iPhone (arm64, ad-hoc)
        run: |
          set -o pipefail
          xcodebuild build \
            -project AutoReel.xcodeproj \
            -scheme AutoReel \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | tee xcodebuild-device.log | xcbeautify --renderer github-actions

      - name: Embeber frameworks FFmpeg (fix crash al iniciar)
        run: |
          APP_PATH=$(find "$DERIVED_DATA/Build/Products" -path '*Release-iphoneos/AutoReel.app' -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No se encontró AutoReel.app"
            exit 1
          fi
          chmod +x scripts/embed-frameworks.sh
          ./scripts/embed-frameworks.sh "$APP_PATH" "$DERIVED_DATA"

      - name: Empaquetar IPA sin firmar (SideStore)
        run: |
          APP_PATH=$(find "$DERIVED_DATA/Build/Products" -path '*Release-iphoneos/AutoReel.app' -type d | head -n 1)
          mkdir -p build-artifact/Payload
          cp -R "$APP_PATH" build-artifact/Payload/
          cd build-artifact
          zip -r AutoReel-unsigned.ipa Payload
          echo "IPA listo (build 2+ con frameworks embebidos)"

      - name: Publicar IPA sin firmar
        uses: actions/upload-artifact@v4
        with:
          name: AutoReel-unsigned-ipa
          path: AutoReel/build-artifact/AutoReel-unsigned.ipa
          retention-days: 14

      - name: Subir logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: AutoReel/xcodebuild-device.log
          if-no-files-found: ignore

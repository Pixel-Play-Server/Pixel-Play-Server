name: AutoReel
options:
  bundleIdPrefix: com.autoreel
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  FFmpegKitSPM:
    url: https://github.com/codewithtamim/ffmpeg-kit-spm
    from: "1.0.1"

targets:
  AutoReel:
    type: application
    platform: iOS
    sources:
      - path: AutoReel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autoreel.app
        INFOPLIST_FILE: AutoReel/Resources/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        ENABLE_BITCODE: NO
    dependencies:
      - package: FFmpegKitSPM
        product: FFmpeg-Kit
        embed: true
    info:
      path: AutoReel/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "6"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false

schemes:
  AutoReel:
    build:
      targets:
        AutoReel: all
    run:
      config: Debug

name: AutoReel
options:
  bundleIdPrefix: com.autoreel
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  FFmpegKit:
    url: https://github.com/kingslay/FFmpegKit
    branch: main

targets:
  AutoReel:
    type: application
    platform: iOS
    sources:
      - path: AutoReel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autoreel.app
        INFOPLIST_FILE: AutoReel/Resources/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: FFmpegKit
        product: FFmpegKit
    info:
      path: AutoReel/Resources/Info.plist
      properties:
        UILaunchScreen: {}

schemes:
  AutoReel:
    build:
      targets:
        AutoReel: all
    run:
      config: Debug
